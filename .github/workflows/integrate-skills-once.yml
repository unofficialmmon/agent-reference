name: integrate-reviewed-skills-once

on:
  push:
    branches:
      - agent-reference-skills-integration-20260903

permissions:
  contents: write

concurrency:
  group: integrate-reviewed-skills-once
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate one-shot inputs
        run: |
          python3 -m py_compile tools/_integrate_skills_once.py tools/audit.py
          python3 -m json.tool catalog/skills-expansion-2026-09-03.json >/dev/null
      - name: Preserve declared-only NestJS license provenance
        run: |
          rm -f .github/skills-integration-trigger-2.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          script = Path('tools/_integrate_skills_once.py')
          text = script.read_text()
          old = '    raise RuntimeError(f"missing license evidence: {item[\'id\']}")'
          new = '''    if item["id"] == "nestjs-best-practices" and item["license"] == "MIT":
              target = ROOT / "catalog/LICENSES/nestjs-best-practices-LICENSE-NOTICE.md"
              target.write_text(
                  "# Upstream license notice\\n\\n"
                  "The pinned upstream `SKILL.md` declares `license: MIT`, but the repository at "
                  f"`{item['revision']}` contains no root license file. This notice preserves that "
                  "provenance limitation; no absent upstream license text is fabricated.\\n",
                  encoding="utf-8",
              )
              return str(target.relative_to(ROOT))
          raise RuntimeError(f"missing license evidence: {item['id']}")'''
          if old not in text:
              raise SystemExit('license fallback marker not found')
          script.write_text(text.replace(old, new, 1))

          manifest_path = Path('catalog/skills-expansion-2026-09-03.json')
          manifest = json.loads(manifest_path.read_text())
          for item in manifest['skills']:
              if item['id'] == 'nestjs-best-practices':
                  item['knownIssues'] = [
                      'The upstream repository has no LICENSE file; MIT is declared only in SKILL.md frontmatter and retained as a provenance notice.'
                  ]
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          python3 -m py_compile tools/_integrate_skills_once.py
      - name: Materialize reviewed snapshots
        run: python3 tools/_integrate_skills_once.py
      - name: Static repository audit
        run: python3 tools/audit.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit validated expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "expand reviewed Skill catalog"
          git push origin HEAD:agent-reference-skills-integration-20260903
