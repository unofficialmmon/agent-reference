name: behavioral-eval

on:
  pull_request:
    paths:
      - 'evaluation/**'
      - 'global/**'
      - 'tools/**'
      - '.github/workflows/behavioral-eval.yml'
  workflow_dispatch:
    inputs:
      confirm_provider_usage:
        description: 'Authorize sending this repository context to the configured Copilot provider'
        type: boolean
        required: true
        default: false
      response_model:
        description: 'Explicit model available to the authorized Copilot account'
        type: string
        required: true
      judge_model:
        description: 'Explicit judge model available to the authorized Copilot account'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: behavioral-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-contract:
    name: Native CLI contract (not model behavior)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AGENTRC_REVISION: 8d0c05c96dcfe674019359bcebd9ab6b251d2203
      COPILOT_VERSION: 1.0.83
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned evaluation CLIs on disposable runner
        run: npm install --global "github:microsoft/agentrc#$AGENTRC_REVISION" "@github/copilot@$COPILOT_VERSION"
      - name: Check native CLI contract without credentials or model calls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eval-evidence"
          agentrc --version > "$RUNNER_TEMP/eval-evidence/versions.txt"
          copilot --version >> "$RUNNER_TEMP/eval-evidence/versions.txt"
          printf 'AgentRC source: %s\n' "$AGENTRC_REVISION" >> "$RUNNER_TEMP/eval-evidence/versions.txt"
          agentrc eval --help > "$RUNNER_TEMP/eval-evidence/eval-help.txt"
          for flag in --repo --model --judge-model --output --fail-level; do
            grep -F -- "$flag" "$RUNNER_TEMP/eval-evidence/eval-help.txt" >/dev/null
          done
          python3 tools/eval_gate.py > "$RUNNER_TEMP/eval-evidence/suite.json"
          echo 'CLI-contract checks only. Model/OpenCode host behavior: NOT RUN unless the explicitly authorized manual steps below execute.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check explicit manual authorization
        id: authorization
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_provider_usage
        env:
          GH_TOKEN: ${{ secrets.AGENTRC_COPILOT_TOKEN }}
          RESPONSE_MODEL: ${{ inputs.response_model }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" || -z "$RESPONSE_MODEL" || -z "$JUDGE_MODEL" ]]; then
            echo 'BLOCKED: a dedicated authorized Copilot token and explicit models are required.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 tools/eval_gate.py --capture-context > "$RUNNER_TEMP/eval-evidence/context.json"
      - name: Run explicitly authorized native policy assessment
        id: native
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_provider_usage
        env:
          GH_TOKEN: ${{ secrets.AGENTRC_COPILOT_TOKEN }}
          RESPONSE_MODEL: ${{ inputs.response_model }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
        shell: bash
        run: |
          set -euo pipefail
          agentrc eval evaluation/agentrc.eval.jsonc --repo "$GITHUB_WORKSPACE" \
            --model "$RESPONSE_MODEL" --judge-model "$JUDGE_MODEL" \
            --output "$RUNNER_TEMP/native-results.json" --fail-level 100 --json \
            > "$RUNNER_TEMP/native-summary.json"
      - name: Enforce complete native result and context
        if: always() && (steps.native.outcome == 'success' || steps.native.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/eval_gate.py --report "$RUNNER_TEMP/native-results.json" \
            --context "$RUNNER_TEMP/eval-evidence/context.json" \
            | tee "$RUNNER_TEMP/eval-evidence/gate.json"
      - name: Upload metadata only (no model responses or trajectories)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eval-evidence/
          if-no-files-found: warn
          retention-days: 14
