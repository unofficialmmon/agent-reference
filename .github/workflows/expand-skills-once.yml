name: Expand reviewed Skill catalog once

on:
  push:
    branches: [main]
    paths:
      - tools/_expand_skills_once.py
      - catalog/skills-expansion-2026-09-02.json
      - .github/workflows/expand-skills-once.yml

permissions:
  contents: write

concurrency:
  group: expand-reviewed-skills-once
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Materialize pinned Skill snapshots
        run: python3 tools/_expand_skills_once.py
      - name: Static repository audit
        run: python3 tools/audit.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit expansion
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No expansion changes to commit"
            exit 1
          fi
          git commit -m "expand reviewed Skill catalog"
          git push origin HEAD:main

# Triggered manually on 2026-09-03 after validating the uploaded multi-Skill bundle.
