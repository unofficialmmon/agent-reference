name: expand-skills-once

on:
  push:
    branches:
      - agent-reference-skills-expansion-20260902
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: expand-skills-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expand:
    runs-on: macos-latest
    steps:
      - name: Checkout bootstrap branch without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ./* ./.??* 2>/dev/null || true
          git clone --depth 1 --branch agent-reference-skills-expansion-20260902 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Materialize one-off generator
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          files = (
              ('.tmp/expand_skills.py.gz.b64', '.tmp/expand_skills.py'),
              ('.tmp/skills-expansion-manifest.json.gz.b64', '.tmp/skills-expansion-manifest.json'),
              ('.tmp/audit.py.gz.b64', 'tools/audit.py'),
          )
          for source, target in files:
              encoded = Path(source).read_bytes()
              Path(target).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          python3 -m py_compile .tmp/expand_skills.py tools/audit.py

      - name: Generate pinned Skill expansion
        run: python3 .tmp/expand_skills.py

      - name: Run deterministic maintainer audit
        run: python3 tools/audit.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit generated expansion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'expand reviewed Skill catalog [skills-expansion-generated]'
          git push origin HEAD:agent-reference-skills-expansion-20260902
