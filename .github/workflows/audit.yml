name: repository-audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/agent-reference-evidence"

      - name: Positive and negative contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -v 2>&1 | tee "$RUNNER_TEMP/agent-reference-evidence/tests.txt"

      - name: Static quality and evaluation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/quality.py > "$RUNNER_TEMP/agent-reference-evidence/quality.json"
          python3 tools/eval_gate.py > "$RUNNER_TEMP/agent-reference-evidence/eval-suite.json"
          python3 tools/freshness.py > "$RUNNER_TEMP/agent-reference-evidence/freshness-offline.json"

      - name: Deterministic repository audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit.py | tee "$RUNNER_TEMP/agent-reference-evidence/audit.txt"
          python3 tools/audit.py --json > "$RUNNER_TEMP/agent-reference-evidence/audit.json"

      - name: Whitespace check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check HEAD
          fi

      - name: Record reproducible source and revision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-reference-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/agent-reference-evidence/revision.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/agent-reference-evidence/source.tar.gz"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-reference-evidence/
          if-no-files-found: error
          retention-days: 14
