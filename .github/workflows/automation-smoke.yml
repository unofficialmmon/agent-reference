name: automation-smoke
on:
  pull_request:
    paths: ['templates/github/**', 'templates/project/**', 'tools/smoke_security.py', '.github/workflows/automation-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: automation-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checkers:
    name: Direct clean/failing checker fixtures (not consumer security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-package" "$RUNNER_TEMP/security-bin"
          cd "$RUNNER_TEMP/gitleaks-package"
          curl --fail --silent --show-error --location --retry 2 -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          printf '%s  checksums.txt\n' 061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae | sha256sum --check
          curl --fail --silent --show-error --location --retry 2 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          install -m 755 gitleaks "$RUNNER_TEMP/security-bin/gitleaks"
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
      - name: Install pinned Trivy on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-package" "$RUNNER_TEMP/security-bin"
          cd "$RUNNER_TEMP/trivy-package"
          curl --fail --silent --show-error --location --retry 2 -o checksums.txt https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_checksums.txt
          printf '%s  checksums.txt\n' bc701c3c3ee8b9acbea2c23257e41381e3854888f51281616a6ba5dc96963821 | sha256sum --check
          curl --fail --silent --show-error --location --retry 2 -O https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf trivy_0.74.0_Linux-64bit.tar.gz trivy
          install -m 755 trivy "$RUNNER_TEMP/security-bin/trivy"
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
      - name: Install pinned ShellCheck and Hadolint on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lint-package" "$RUNNER_TEMP/security-bin"
          cd "$RUNNER_TEMP/lint-package"
          curl --fail --silent --show-error --location --retry 2 -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  shellcheck.tar.xz\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 | sha256sum --check
          tar -xJf shellcheck.tar.xz shellcheck-v0.11.0/shellcheck
          install -m 755 shellcheck-v0.11.0/shellcheck "$RUNNER_TEMP/security-bin/shellcheck"
          curl --fail --silent --show-error --location --retry 2 -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          printf '%s  hadolint\n' c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507 | sha256sum --check
          install -m 755 hadolint "$RUNNER_TEMP/security-bin/hadolint"
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
      - name: Test clean and failing fixtures including partial staging
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/smoke_security.py | tee "$RUNNER_TEMP/security-fixture-results.json"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-fixture-results.json
          if-no-files-found: warn
          retention-days: 14
