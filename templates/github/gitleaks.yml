name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install reviewed Gitleaks release with pinned checksum evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-package" "$RUNNER_TEMP/security-bin"
          cd "$RUNNER_TEMP/gitleaks-package"
          curl --fail --silent --show-error --location --retry 2 -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          printf '%s  checksums.txt\n' 061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae | sha256sum --check
          curl --fail --silent --show-error --location --retry 2 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          install -m 755 gitleaks "$RUNNER_TEMP/security-bin/gitleaks"
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
      - name: Scan checked-out Git history
        run: gitleaks git --redact --no-banner --exit-code 1 .
